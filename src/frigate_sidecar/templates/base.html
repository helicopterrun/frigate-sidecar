<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="color-scheme" content="dark">
<title>{% block title %}frigate-sidecar{% endblock %}</title>
<script>
/* Apply the saved theme before the stylesheet paints (no flash). */
try { var t = localStorage.getItem("sidecar.theme");
      if (t) document.documentElement.setAttribute("data-theme", t); } catch (e) {}
</script>
<link rel="stylesheet" href="/static/css/triage.css?v={{ asset_v }}">
{% block head %}{% endblock %}
</head>
<body{% block body_attrs %}{% endblock %}>
{% block header %}{% include "_header.html" %}{% endblock %}
{% block body %}{% endblock %}
<script src="/static/js/theme.js?v={{ asset_v }}"></script>
{% block scripts %}{% endblock %}
</body>
</html>
