name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install ffmpeg
        # The scrub-generator tests probe GOP cadence with ffprobe; without it
        # they fail with KeyError on profile.gop_s.
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends ffmpeg
      - name: Install
        run: pip install -e .[dev]
      - name: Lint
        run: ruff check .
      - name: Typecheck
        run: mypy src/frigate_sidecar
      - name: Test
        run: pytest -ra
