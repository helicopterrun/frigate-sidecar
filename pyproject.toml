[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "frigate-sidecar"
version = "0.1.0"
description = "Companion server for Frigate NVR: triage UI and read-only analysis tooling"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "helicopterrun" }]
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
    "pydantic>=2.9",
    "pydantic-settings>=2.6",
    "pyyaml>=6.0",
    "typer>=0.13",
    "jinja2>=3.1",
    "httpx>=0.27",
]

[project.optional-dependencies]
annotation = [
    # Used by analysis.annotation_offset (template matching).
    "opencv-python-headless>=4.10",
    "numpy>=1.26",
]
dev = [
    "pytest>=8.3",
    "pytest-asyncio>=0.24",
    "ruff>=0.7",
    "mypy>=1.13",
    "types-PyYAML",
]

[project.scripts]
fsc = "frigate_sidecar.cli:app"
frigate-sidecar = "frigate_sidecar.cli:app"

[tool.hatch.build.targets.wheel]
packages = ["src/frigate_sidecar"]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"
asyncio_mode = "auto"

[tool.mypy]
python_version = "3.12"
warn_unused_ignores = true
warn_redundant_casts = true
ignore_missing_imports = true
